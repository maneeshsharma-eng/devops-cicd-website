
name: Test and Deploy Website to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-build-deploy:
    name: Test, Package and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          grep -q "DevOps Training" index.html
          grep -q "CI/CD Deployment Successful" index.html
          echo "Website validation passed."

      - name: Build and package website
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/
          test -s dist/index.html
          test -s dist/style.css
          test -s dist/script.js
          tar -czf website.tar.gz -C dist .
          echo "Website package created."
          ls -lh website.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy website to S3
        run: |
          aws s3 sync dist/ \
            "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --cache-control "no-cache, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
